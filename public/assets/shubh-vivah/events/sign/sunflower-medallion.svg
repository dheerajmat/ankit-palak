<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Radial Gold Shimmer -->
    <radialGradient id="sunGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#E5A93B" />
      <stop offset="85%" stop-color="#B87718" />
      <stop offset="100%" stop-color="#7A4505" />
    </radialGradient>

    <!-- Ruby Crimson Gradient -->
    <linearGradient id="rubyPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D92534" />
      <stop offset="60%" stop-color="#9E1321" />
      <stop offset="100%" stop-color="#5E060E" />
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="emeraldLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#1B662F" />
    </linearGradient>

    <!-- Golden Ray Gradient -->
    <linearGradient id="goldRayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="60%" stop-color="#D49924" />
      <stop offset="100%" stop-color="#9C640C" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="sunDropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#56080E" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#sunDropShadow)">
