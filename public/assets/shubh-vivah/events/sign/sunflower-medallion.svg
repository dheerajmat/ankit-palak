        <path d="M 0 -28 C 4 -28, 5 -22, 4 -16 C 0 -15, -4 -16, -4 -22 C -5 -28, -3 -28, 0 -28 Z" fill="#FFA500" stroke="#7A4505" stroke-width="0.5" transform="rotate(191.25)" />
