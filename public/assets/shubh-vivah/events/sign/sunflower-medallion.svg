        <path d="M -3 -46 L 0 -49 L 3 -46 L 2 -32 L -2 -32 Z" fill="url(#goldRayGrad)" transform="rotate(67.5)" />
        <path d="M -3 -46 L 0 -49 L 3 -46 L 2 -32 L -2 -32 Z" fill="url(#goldRayGrad)" transform="rotate(90)" />
        <path d="M -3 -46 L 0 -49 L 3 -46 L 2 -32 L -2 -32 Z" fill="url(#goldRayGrad)" transform="rotate(112.5)" />
