<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Handmade wedding-card paper: a crisp fine tooth and scattered deep-gold flecks.
       Transparent, so the page colour shows through; stitchTiles keeps the tile seamless. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.22  0 0 0 0 0.08  0 0 0 2.2 -1.05"/>
  </filter>
  <filter id="flecks" x="0" y="0" width="100%" height="100%">
    <!-- only the highest peaks of the noise survive, leaving tiny sparse specks -->
    <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="1" seed="23" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.66  0 0 0 0 0.43  0 0 0 0 0.1  0 0 0 34 -24.4"/>
  </filter>
  <rect width="420" height="420" filter="url(#grain)" opacity="0.4"/>
  <rect width="420" height="420" filter="url(#flecks)" opacity="0.85"/>
</svg>
